name: Mobile app validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mobile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Expo app configuration
        run: npx expo config --type public
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build browser preview
        run: npx expo export --platform web
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install render server dependencies
        run: pip install -r render-server/requirements.txt
      - name: Test render server and local TTS
        working-directory: render-server
        run: python -m unittest -v
